[project]
name = "thalam"
version = "0.0.1"
description = "Release-coordination agent with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "packaging>=26.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling==1.33.0"]   # pinned, as in Kaval
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/shared/thalam_shared", "services/collector/thalam_collector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The dashboard's HTML templates read better unwrapped. Every other rule still applies; Kaval
# leaves its dashboard generator out of ruff altogether.
"scripts/tracking/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["services", "scripts/dev", "scripts/ops", "scripts/tracking", "infra"]
# importlib: test files in different services may share a name (SPEC-002-R14). It no longer puts
# each test's folder on sys.path, so the script folders whose tests import their module by its
# bare name are listed here.
addopts = "--import-mode=importlib"
pythonpath = ["scripts/dev", "scripts/ops", "scripts/tracking"]
