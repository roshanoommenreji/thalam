[project]
name = "thalam"
version = "0.0.1"
description = "Release-coordination agent with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling==1.33.0"]   # pinned, as in Kaval
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/shared/thalam_shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The dashboard's HTML templates read better unwrapped. Every other rule still applies; Kaval
# leaves its dashboard generator out of ruff altogether.
"scripts/tracking/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["services", "scripts/dev", "scripts/ops", "scripts/tracking", "infra"]
