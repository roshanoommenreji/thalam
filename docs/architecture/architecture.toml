[[infra.edge]]
from = "sweepcheck"
to = "rg"
label = "reads"
kind = "data"

# ═══ GLOSSARY: the words this project uses, defined once ═══════════════════════════════════════

[[glossary]]
term = "Proposal"
group = "Thalam"
definition = "A row in which the agent says what it wants done, why, and with what evidence. The agent's only write; nothing changes until policy and, where asked, a person allow it."
where = "Architecture, Flows"

[[glossary]]
term = "Executor"
group = "Thalam"
definition = "The only component that writes to outside systems, with scoped bot accounts, and only for approved proposals."
where = "Architecture"

[[glossary]]
term = "auto / ask / never"
group = "Thalam"
definition = "The three classes OPA gives an action: done without asking, done after a person approves, or refused. Every action starts as ask."
where = "Flows: Create the Jira release"

[[glossary]]
term = "interrupt()"
group = "Thalam"
definition = "LangGraph's pause: the graph saves its checkpoint and waits. It never acts; it resumes on the executor's recorded outcome."
where = "Flows: Create the Jira release"

[[glossary]]
term = "Checkpoint"
group = "Thalam"
definition = "LangGraph's saved state of a graph, kept in Postgres, so a paused workflow survives a restart."
where = "Architecture: Release graph"

[[glossary]]
term = "Release graph"
group = "Thalam"
definition = "Thalam's database of components, their dependencies, releases and calendar windows. Dependency questions are answered from it with no model."
where = "Architecture"

[[glossary]]
term = "Guard layers"
group = "Thalam"
definition = "The eight checks around every request and answer, each stopping a different failure and failing closed (ADR-0005)."
where = "Architecture, Flows: Ask a question"

[[glossary]]
term = "Spotlighting"
group = "Thalam"
definition = "Wrapping outside text (Jira descriptions, commit messages, chat input) as labelled data, so the model reads it but never obeys it (guard layer 4)."
where = "Flows: Ask a question"

[[glossary]]
term = "Grounding check"
group = "Thalam"
definition = "Every release-note line and every claim in an answer must cite a Jira key, a PR or a passage. An uncited line fails."
where = "Flows: Ask a question"

[[glossary]]
term = "Model router"
group = "Thalam"
definition = "The code that picks a model per call (Ollama locally, Claude hosted) and holds the monthly cap in code (ADR-0006)."
where = "Architecture"

[[glossary]]
term = "Readiness gate"
group = "Release management"
definition = "The checks a release must pass before it goes out: CI, scope, scans, signed image, upstream dependencies, change approval and window, freezes, rollback plan."
where = "Flows: The readiness gate"

[[glossary]]
term = "fixVersion"
group = "Release management"
definition = "Jira's name for a release: the version an issue is fixed in. Thalam creates it and releases it, through the executor."
where = "Architecture"

[[glossary]]
term = "Change request"
group = "Release management"
definition = "ServiceNow's record that a change is planned, approved and inside a window; closed after the release, successful or with issues."
where = "Architecture"

[[glossary]]
term = "CAB"
group = "Release management"
definition = "Change Advisory Board: the people who approve changes. Thalam drafts its weekly summary."
where = "Architecture: Release notes"

[[glossary]]
term = "Freeze window"
group = "Release management"
definition = "A period when nothing may be released, such as a peak sales week. Releasing into one is classed never."
where = "Flows: The readiness gate"

[[glossary]]
term = "Golden signals"
group = "Release management"
definition = "Latency, traffic, errors and saturation: the four measures the post-release watch compares with the baseline."
where = "Flows: Watch a release"

[[glossary]]
term = "DORA metrics"
group = "Release management"
definition = "Deployment frequency, lead time for changes, change failure rate and time to restore, per team."
where = "Flows: Watch a release"

[[glossary]]
term = "Global Standard deployment"
group = "Azure"
definition = "A Foundry model deployment billed per token and served from Microsoft's global capacity. Nothing bills while it is idle, so deleting it loses nothing."
where = "Azure"

[[glossary]]
term = "Capacity"
group = "Azure"
definition = "A deployment's rate limit in units: one unit is one request and a thousand tokens a minute. Thalam runs at {capacity}, with Azure Policy capping it at {cap}."
where = "Azure, Cost"

[[glossary]]
term = "Budget"
group = "Azure"
definition = "A monthly amount with alert lines. It only alerts, and late (cost data lags up to {lag_days} days); Azure pay-as-you-go has no hard spending limit."
where = "Azure, Cost"

[[glossary]]
term = "Brake line"
group = "Azure"
definition = "The alert line that starts the brake: {total_brake_pct}% of the total budget ({total_brake}) or {model_brake_pct}% of the model budget ({model_brake})."
where = "Cost, Flows: The cost brake"

[[glossary]]
term = "Action group"
group = "Azure"
definition = "Azure Monitor's list of who to tell and what to start when an alert fires. Thalam's e-mails the owner and starts the brake runbook."
where = "Azure"

[[glossary]]
term = "Runbook"
group = "Azure"
definition = "A script Azure Automation runs on demand or on a schedule. Thalam's brake is one, in Python with the standard library only."
where = "Azure"

[[glossary]]
term = "Managed identity"
group = "Azure"
definition = "An identity Azure gives a resource so it can call other Azure services without a stored secret. The brake's holds one custom role."
where = "Azure"

[[glossary]]
term = "Azure Policy"
group = "Azure"
definition = "Rules Azure enforces on every create and update. Thalam's refuses anything but the approved model, type, capacity and region."
where = "Azure"

[[glossary]]
term = "Park / unpark"
group = "Azure"
definition = "Deleting the deployment when it is not in use (`make foundry-down`) and creating it again (`make foundry-up`, only when every guardrail holds)."
where = "Flows: Park and unpark"

[[glossary]]
term = "Sweep"
group = "Azure"
definition = "`make azure-sweep`: a read-only check at the end of every session that nothing billable was left behind."
where = "DevOps, Flows: Park and unpark"

[[glossary]]
term = "Foundry IQ"
group = "Azure"
definition = "Microsoft's knowledge layer for agents (formerly Azure AI Search), used only on its Free or Serverless tier."
where = "Architecture"

[[glossary]]
term = "Claude Consumption Units"
group = "Azure"
definition = "How Claude on Foundry is billed: through Azure Marketplace, at Anthropic's prices, on the Azure bill in rupees."
where = "Azure: Cost Management"

[[glossary]]
term = "Ruleset"
group = "DevOps"
definition = "GitHub's rules for a branch. main takes pull requests only, with five checks green, linear history and no force-push."
where = "DevOps"

[[glossary]]
term = "Required check"
group = "DevOps"
definition = "A CI job a pull request must pass to merge, matched by its exact name: lint, test, secrets, codeql (python), codeql (actions)."
where = "DevOps"

[[glossary]]
term = "Squash merge"
group = "DevOps"
definition = "A pull request's commits become one commit on main, so each story is one line of history."
where = "DevOps"

[[glossary]]
term = "gitleaks"
group = "DevOps"
definition = "A secret scanner, run before each commit and in CI over the whole history, with rules for this project's real addresses and IDs."
where = "DevOps"

[[glossary]]
term = "CodeQL"
group = "DevOps"
definition = "GitHub's code-scanning engine, run on the Python code and on the workflow files."
where = "DevOps"

[[glossary]]
term = "SBOM"
group = "DevOps"
definition = "Software bill of materials: the list of everything inside an image, published with it from Phase 7."
where = "DevOps"

[[glossary]]
term = "Promotion by digest"
group = "DevOps"
definition = "Production gets the exact image staging tested, named by its content hash, never rebuilt (CLAUDE.md rule 5)."
where = "DevOps"

[[glossary]]
term = "AI-DLC"
group = "Ways of working"
definition = "The AI-driven development life cycle Thalam follows: Inception (questions, then an approved spec), Construction (plan, tests, code), Operations (lessons back into specs) (ADR-0010)."
where = "Requirements"

[[glossary]]
term = "Requirement ID"
group = "Ways of working"
definition = "A spec's numbered requirement, such as SPEC-001-R13. Each is proved by a test that cites it (`# covers:`) or by a live proof in a lab."
where = "Requirements"

[[glossary]]
term = "Lab"
group = "Ways of working"
definition = "A step-by-step document a stranger could follow to reproduce what was built, with its evidence recorded. Lab 00 holds Phase 0's live proofs."
where = "Requirements"

[[glossary]]
term = "ADR"
group = "Ways of working"
definition = "Architecture decision record: one decision, why, and what was rejected. A later ADR amends an earlier one with a dated note."
where = "Decisions"
