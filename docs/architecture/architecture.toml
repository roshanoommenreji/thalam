# Thalam's architecture, as data (Kaval's architecture.toml, for Thalam).
#
# scripts/tracking/dashboard.py draws this into the dashboard's Architecture, Flows, Azure, DevOps
# and Glossary views. Each node's state (built / being built / planned) comes from its phase's
# marker in ROADMAP.md, and each Azure node's from the saved Azure copy. Nothing here records
# status.
#
# When a component is added, removed or rewired, update this file in the same change. That is a
# Definition of Done item (6), and it is why the diagrams stay true.
#
# Public file (CLAUDE.md rule 6): no instance address, resource name that is not already in
# guardrails.json, or ID. Names and numbers from guardrails.json are written as {placeholders}
# and filled in when the page is built, so a changed number cannot leave a stale copy here:
#   {ceiling} {plan} {total_amount} {model_amount} {total_brake} {model_brake}
#   {total_brake_pct} {model_brake_pct} {nightly} {capacity} {cap} {region} {lag_days} {model}
#   {sku} {resource_group} {assignment} {action_group} {runbook} {schedule} {automation_account}
#
# col and row place a node on its diagram's grid; both accept fractions.
# Node kinds:  source | service | store | guard | model | surface | target | platform
# Edge kinds:  data (solid) | control (dashed) | write (a write outside Thalam, executor only)

# ═══ ARCHITECTURE: what Thalam is made of, and what talks to what ═══════════════════════════════

[[architecture.node]]
id = "jira-in"
label = "Jira"
sub = "issues, versions"
kind = "source"
col = 0
row = 0
access = "read-only token (sandbox site)"
definition = "Where teams track the work going into each release. Thalam reads issues, fixVersions and their status; it never writes with this token."
inputs = ["Issues, fixVersions, sprints, links between issues"]
outputs = ["Release scope: which issues are in which version, and whether each is done"]

[[architecture.node]]
id = "git"
label = "Git / GitHub"
sub = "commits, PRs"
kind = "source"
col = 1
row = 0
access = "read-only token"
definition = "The code behind each release. Merged pull requests become release-note lines, each citing its PR."
inputs = ["Commits, tags, merged pull requests"]
outputs = ["What changed between two versions, and who approved it"]

[[architecture.node]]
id = "cicd"
label = "CI/CD"
sub = "runs, artifacts"
kind = "source"
col = 2
row = 0
access = "read-only token"
definition = "Build and deploy pipelines. Their results feed the readiness gate: a release commit must be green."
inputs = ["Pipeline runs, test reports, scan results, image digests"]
outputs = ["Pass or fail per release commit; signed image and SBOM present or not"]

[[architecture.node]]
id = "prom"
label = "Prometheus"
sub = "golden signals"
kind = "source"
col = 3
row = 0
access = "read-only HTTP queries"
definition = "Metrics for each service: latency, traffic, errors and saturation. The post-release watch compares them with the pre-release baseline."
inputs = ["Scraped metrics from every service"]
outputs = ["Range queries over the watch window, and the baseline before it"]

[[architecture.node]]
id = "snow-in"
label = "ServiceNow"
sub = "change requests"
kind = "source"
col = 4
row = 0
access = "snc_read_only + itil, Machine identity"
definition = "The change-management record. Thalam reads whether a change is approved and inside its window."
inputs = ["Change requests, their state, approval and planned window"]
outputs = ["Approved or not; inside the window or not"]

[[architecture.node]]
id = "kaval"
label = "Kaval"
sub = "incidents (FS-1)"
kind = "source"
col = 5
row = 0
access = "MCP / HTTPS, read-only"
definition = "The sibling ops agent. During a post-release window its incidents are a second opinion on whether the release hurt something (future scope FS-1)."
inputs = ["Incidents and their fingerprints"]
outputs = ["Incidents that overlap a release's watch window"]

[[architecture.node]]
id = "catalog"
label = "Backstage catalog"
sub = "catalog-info.yaml"
kind = "source"
phase = 1
col = 6
row = 0
access = "files in each repository"
definition = "Each service declares itself, its owner team and what it depends on in a catalog-info.yaml file. That is where the dependency graph comes from."
inputs = ["One catalog-info.yaml per component"]
outputs = ["Components, owners, and component-to-component dependencies"]

[[architecture.node]]
id = "collector"
label = "Collector"
sub = "events in"
kind = "service"
phase = 1
col = 3
row = 1
access = "read-only clients only"
definition = "Pulls from every source on a schedule and writes what it found into the release graph as events. It holds no write credential to any outside system."
inputs = ["Every source above, read-only"]
outputs = ["Rows in the release graph: components, dependencies, releases, release items"]

[[architecture.node]]
id = "graph"
label = "Release graph"
sub = "Postgres + pgvector"
kind = "store"
phase = 1
col = 3
row = 2
access = "Thalam's own database"
definition = "The system of record: components, dependencies, releases, calendar windows, checks, proposals and the audit trail, append-only like Kaval's. LangGraph's checkpoints live here too."
inputs = ["Collector events", "Check results", "Proposals, decisions, executions, outcomes"]
outputs = ["Answers to dependency questions (upstream, downstream, release order by topological sort)"]

[[architecture.node]]
id = "langfuse"
label = "Langfuse"
sub = "traces, token cost"
kind = "platform"
phase = 2
col = 0.5
row = 2
access = "write-only from Thalam's code"
definition = "Where every model call is traced, in OpenTelemetry's GenAI terms: prompt, answer, tokens, cost and every guardrail verdict (ADR-0004)."
inputs = ["Spans from the agent and the router"]
outputs = ["Cost per conversation; a record of what each guard layer decided"]

[[architecture.node]]
id = "iq"
label = "Foundry IQ"
sub = "policies, runbooks"
kind = "store"
phase = 2
col = 4.6
row = 2
access = "read-only retrieval"
definition = "Azure's knowledge layer (formerly Azure AI Search), on the Free or Serverless tier only. It serves release policies, runbooks, CAB rules and freeze calendars (ADR-0012)."
inputs = ["Policy documents, runbooks, freeze calendars"]
outputs = ["Passages the agent cites when it answers"]

[[architecture.node]]
id = "ollama"
label = "Ollama"
sub = "local small model"
kind = "model"
phase = 2
col = 6
row = 2.4
access = "local only"
definition = "A small model on the laptop for guard checks, classification and offline eval runs. Free, and what the router falls back to when the hosted cap is reached (ADR-0006)."
inputs = ["Short classification prompts"]
outputs = ["Labels and verdicts"]

[[architecture.node]]
id = "guard"
label = "Guard layers"
sub = "in, screen, out"
kind = "guard"
phase = 2
col = 1.5
row = 3
access = "a package every graph calls"
definition = "Eight layers, each stopping a different failure: identity, input limits, input screen, untrusted text as data, tool allowlists, output checks, policy and approval, and evals as evidence. Each fails closed (ADR-0005)."
inputs = ["Every request in, every model answer out"]
outputs = ["A screened request or a plain refusal; a checked, escaped answer"]

[[architecture.node]]
id = "agent"
label = "Agent"
sub = "LangGraph graphs"
kind = "service"
phase = 2
col = 3
row = 3
access = "read-only credentials; one write: a proposal row"
definition = "The reasoning part. Graphs for chat, readiness, release notes, the post-release watch and the CAB summary. It can read everything and change nothing (CLAUDE.md rule 3)."
inputs = ["Questions from the gateway", "Release graph rows", "Foundry IQ passages", "Executor outcomes (to resume)"]
outputs = ["Chat answers", "Proposals", "Traces"]

[[architecture.node]]
id = "router"
label = "Model router"
sub = "local or hosted"
kind = "service"
phase = 2
col = 4.6
row = 3
access = "the Foundry key, from .env"
definition = "Chooses the model for each call: Ollama for small checks, Claude for chat and writing. It holds the monthly spending cap in code, so it stops spend before Azure's late budgets notice (ADR-0006)."
inputs = ["A prompt and what it is for"]
outputs = ["A model answer, or a refusal once the cap is reached"]

[[architecture.node]]
id = "claude"
label = "Claude on Foundry"
sub = "{model}"
kind = "model"
phase = 0
col = 6
row = 3.4
access = "API key in .env; never the executor's"
definition = "The hosted model: {model} as a {sku} deployment at capacity {capacity}, in Thalam's own resource group. It exists only while it is used (`make foundry-up` / `foundry-down`); see the Azure view."
inputs = ["Messages API calls from the router"]
outputs = ["Answers, billed per token through Azure Marketplace"]

[[architecture.node]]
id = "people"
label = "People"
sub = "release managers"
kind = "surface"
col = 0
row = 4.6
access = "OIDC login"
definition = "Release managers and engineers asking questions and approving proposals."
inputs = ["Answers, approval cards"]
outputs = ["Questions, approvals"]

[[architecture.node]]
id = "gateway"
label = "Gateway + web chat"
sub = "FastAPI"
kind = "surface"
phase = 2
col = 1.5
row = 4.6
access = "front door; carries the user's identity"
definition = "The web chat and its API. It logs people in, applies limits and attaches the user to every request (guard layers 1 and 2, ADR-0007)."
inputs = ["Chat messages"]
outputs = ["Requests to the agent, with identity", "Escaped answers back"]

[[architecture.node]]
id = "proposals"
label = "Proposals"
sub = "the only write"
kind = "store"
phase = 3
col = 3
row = 4.3
access = "the agent inserts; nobody edits"
definition = "A row saying what the agent wants done, why, and with what evidence. It is the agent's only output that can lead to a change."
inputs = ["propose_* tool calls from the agent"]
outputs = ["Rows for policy to classify"]

[[architecture.node]]
id = "policy"
label = "Policy (OPA)"
sub = "auto / ask / never"
kind = "guard"
phase = 3
col = 4.6
row = 4.3
access = "rules in policy/, versioned"
definition = "Classes every proposed action. Everything starts as ask; never includes releasing into a freeze window or closing a change as successful without a post-release check."
inputs = ["A proposal"]
outputs = ["auto, ask or never"]

[[architecture.node]]
id = "slack"
label = "Slack approval"
sub = "a person decides"
kind = "surface"
phase = 3
col = 6
row = 4.3
access = "one channel: #thalam-releases"
definition = "An approval card with a reminder, an escalation and an expiry (Kaval's pattern). The person's decision is recorded as a decision row."
inputs = ["Proposals classed ask"]
outputs = ["Approve or deny, with who and when"]

[[architecture.node]]
id = "executor"
label = "Executor"
sub = "the only writer"
kind = "service"
phase = 3
col = 4.6
row = 5.4
access = "scoped bot accounts"
definition = "The only part that writes to Jira, ServiceNow, Confluence, the calendar or Slack announcements, and only for a proposal that passed policy and, where asked, a person. Every call carries an idempotency key."
inputs = ["Approved decisions"]
outputs = ["Changes in outside systems", "Execution and outcome rows that resume the graph"]

[[architecture.node]]
id = "jira-out"
label = "Jira fixVersion"
kind = "target"
phase = 3
col = 1.4
row = 6.5
access = "executor's bot account"
definition = "The release in Jira, created and later released by the executor."
inputs = ["Create and release calls"]
outputs = ["A version teams can see"]

[[architecture.node]]
id = "snow-out"
label = "ServiceNow change"
kind = "target"
phase = 3
col = 2.8
row = 6.5
access = "executor's bot account"
definition = "The change request, opened before a release and closed after its post-release check (Change Management API)."
inputs = ["Create and close calls"]
outputs = ["A change the CAB can approve"]

[[architecture.node]]
id = "confluence"
label = "Release notes"
sub = "Confluence"
kind = "target"
phase = 5
col = 4.2
row = 6.5
access = "executor's bot account"
definition = "Release notes in which every line cites a Jira key or a PR (the grounding check), for engineers, customers and the CAB."
inputs = ["Approved drafts"]
outputs = ["Published notes"]

[[architecture.node]]
id = "calendar"
label = "Release calendar"
sub = "iCal feed"
kind = "target"
phase = 5
col = 5.6
row = 6.5
access = "executor"
definition = "Every release and freeze window, published as an iCal (RFC 5545) feed and a weekly digest."
inputs = ["Releases and calendar windows"]
outputs = ["A feed people subscribe to"]

[[architecture.node]]
id = "slack-out"
label = "Announcements"
sub = "Slack"
kind = "target"
phase = 3
col = 7
row = 6.5
access = "executor's bot"
definition = "Release announcements in #thalam-releases, posted only by the executor."
inputs = ["Approved announcements"]
outputs = ["A message people read"]

