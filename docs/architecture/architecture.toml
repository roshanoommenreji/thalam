kind = "local"
col = 0
row = 0
file = "CLAUDE.md (Commits and branches)"
definition = "Every change starts on a short-lived branch named after its Jira story. AI-DLC first: a spec is approved before code for anything non-trivial (ADR-0010)."
inputs = ["An approved spec or a small fix"]
outputs = ["Commits"]

