definition = "Checks the commit convention before the commit exists: a type, then the story's Jira key on a story branch (SPEC-001-R5)."
inputs = ["The commit message and the branch name"]
outputs = ["A commit, or the reason it was refused"]

[[devops.node]]
id = "local"
label = "make lint, make test"
sub = "before pushing"
kind = "local"
col = 0
row = 3
file = "Makefile"
definition = "ruff and mypy --strict, then pytest and the requirement table. The same commands CI runs, so a red CI is never a surprise."
inputs = ["The working tree"]
outputs = ["Green, or what to fix"]

[[devops.node]]
