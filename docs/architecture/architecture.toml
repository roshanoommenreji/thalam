label = "Pull request"
sub = "the only way to main"
kind = "github"
col = 1.5
row = 1.7
file = ".github/rulesets/main.json"
definition = "Opened from the story branch. Its description ends with the Claude Code line; merging needs every required check green."
inputs = ["A pushed branch"]
outputs = ["Five required checks start"]

[[devops.node]]
id = "dependabot"
label = "Dependabot"
sub = "weekly, grouped"
kind = "github"
col = 1.5
row = 3.4
file = ".github/dependabot.yml"
definition = "Opens grouped pull requests for outdated uv packages and GitHub Actions every week. Each goes through the same checks and merges only when green (SPEC-001-R7)."
inputs = ["uv.lock, workflow files"]
outputs = ["Pull requests"]

[[devops.node]]
id = "lint"
label = "lint"
sub = "ruff, mypy, commits"
kind = "check"
col = 3
row = 0
file = ".github/workflows/ci.yml"
definition = "`make lint`, then the commit check over every commit the pull request adds (SPEC-001-R4, R5)."
inputs = ["The pull request's head commit"]
outputs = ["Pass or fail, required by name"]

[[devops.node]]
id = "test"
label = "test"
sub = "pytest, spec check"
kind = "check"
col = 3
row = 0.85
file = ".github/workflows/ci.yml"
definition = "Every test, then the requirement table as a job summary. A requirement ID with no citing test or live proof fails a Built spec (SPEC-001-R8)."
inputs = ["The pull request's head commit"]
outputs = ["Pass or fail, required by name"]

[[devops.node]]
id = "secrets"
label = "secrets"
sub = "gitleaks, all history"
kind = "check"
col = 3
row = 1.7
file = ".github/workflows/ci.yml"
definition = "gitleaks over the whole history, with a checksum-verified binary: the repo is public, so history must be clean (SPEC-001-R6)."
inputs = ["Every commit ever made"]
outputs = ["Pass or fail, required by name"]

[[devops.node]]
id = "codeql-py"
label = "codeql (python)"
sub = "code scanning"
kind = "check"
col = 3
row = 2.55
file = ".github/workflows/codeql.yml"
definition = "GitHub's code scanner on the Python code; free because the repo is public (SPEC-001-R7)."
inputs = ["The Python sources"]
outputs = ["Alerts; pass or fail, required by name"]

[[devops.node]]
id = "codeql-act"
label = "codeql (actions)"
sub = "workflow scanning"
kind = "check"
col = 3
row = 3.4
file = ".github/workflows/codeql.yml"
definition = "The same scanner on the workflow files: CI is code, and it holds a token. Every third-party action is pinned to a full commit SHA."
inputs = ["The workflow files"]
outputs = ["Alerts; pass or fail, required by name"]

[[devops.node]]
id = "ruleset"
label = "Ruleset on main"
sub = "5 checks, PR only"
kind = "gate"
col = 4.5
row = 1.7
file = ".github/rulesets/main.json"
definition = "Changes reach main by pull request only, with lint, test, secrets and both CodeQL jobs green; linear history; no force-push; no deletion; zero required approvals (one person); nobody can bypass it."
inputs = ["The five check results"]
outputs = ["Merge allowed or blocked"]

[[devops.node]]
