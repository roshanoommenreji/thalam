# ═══ FLOWS: what happens, step by step, for the things Thalam does ═════════════════════════════
# Each flow is drawn as a sequence diagram: one column per participant, one arrow per step.
# Step kinds: call (solid) | return (dashed) | write (a write outside Thalam) | self (a note)

[[flow]]
id = "flow-ask"
title = "Ask a question in chat"
phase = 2
trigger = "Someone asks in the web chat: \"What is going out on Thursday?\""
outcome = "An answer that cites its sources. Nothing outside Thalam changed: the agent holds no write credential."
lanes = [["people", "Person"], ["gateway", "Gateway"], ["guard", "Guard"], ["agent", "Agent"], ["graph", "Release graph"], ["iq", "Foundry IQ"], ["router", "Router"], ["claude", "Claude"]]
steps = [
  { from = "people", to = "gateway", kind = "call", label = "question", note = "Through the web chat (ADR-0007). The person is logged in with OIDC." },
  { from = "gateway", to = "guard", kind = "call", label = "who, how much", note = "Guard layers 1 and 2: identity, a size cap, a rate limit and a token budget per person and per conversation." },
  { from = "guard", to = "agent", kind = "call", label = "screened question", note = "Layer 3: personal data redacted, a prompt-injection classifier, and a topic rail (release management only). A blocked request gets a plain reply, never a silent drop." },
  { from = "agent", to = "graph", kind = "call", label = "Thursday's releases", note = "Read-only SQL over release, release_item and calendar_window." },
  { from = "graph", to = "agent", kind = "return", label = "rows", note = "Releases, their components, owners and dependencies." },
  { from = "agent", to = "iq", kind = "call", label = "freeze rules", note = "Foundry IQ returns the passages of the freeze calendar and CAB rules that apply." },
  { from = "agent", to = "router", kind = "call", label = "prompt", note = "Layer 4: Jira text and change notes are flattened, capped and wrapped as labelled data, never as instructions." },
  { from = "router", to = "claude", kind = "call", label = "Messages API", note = "Haiku first. Above the monthly cap the router refuses and falls back to Ollama." },
  { from = "claude", to = "agent", kind = "return", label = "draft answer", note = "Billed per token on Thalam's Azure bill." },
  { from = "agent", to = "guard", kind = "call", label = "check answer", note = "Layer 6: schema validation, a secret and personal-data scan, and a grounding check that each claim cites a source." },
  { from = "guard", to = "people", kind = "return", label = "escaped answer", note = "Back through the gateway, escaped for HTML. The whole exchange is traced to Langfuse with its token cost." },
]

[[flow]]
id = "flow-change"
title = "Create the Jira release and the ServiceNow change"
phase = 3
trigger = "The agent decides a release needs its Jira version and its change request."
outcome = "A Jira version and a ServiceNow change exist, each created once. A denied or expired proposal changes nothing."
lanes = [["agent", "Agent"], ["proposals", "Proposals"], ["policy", "Policy (OPA)"], ["slack", "Slack card"], ["approver", "Approver"], ["executor", "Executor"], ["jira-out", "Jira"], ["snow-out", "ServiceNow"]]
steps = [
  { from = "agent", to = "proposals", kind = "call", label = "propose", note = "A schema-valid proposal row: what to create, why, and the evidence. This is the agent's only write." },
  { from = "agent", to = "agent", kind = "self", label = "interrupt()", note = "The graph pauses and saves its checkpoint. interrupt() pauses; it never acts." },
  { from = "proposals", to = "policy", kind = "call", label = "classify", note = "OPA returns auto, ask or never. Every action starts as ask." },
  { from = "policy", to = "slack", kind = "call", label = "ask", note = "An approval card in #thalam-releases." },
  { from = "slack", to = "approver", kind = "call", label = "card", note = "With a reminder, an escalation and an expiry (Kaval ADR-0026, ADR-0048)." },
  { from = "approver", to = "slack", kind = "return", label = "approve", note = "Recorded as a decision row: who, when, and what they saw." },
  { from = "slack", to = "executor", kind = "call", label = "decision", note = "The executor acts only on a decision that passed policy and, here, a person." },
  { from = "executor", to = "jira-out", kind = "write", label = "fixVersion", note = "Scoped bot account. An idempotency key means a retry never creates a second version." },
  { from = "executor", to = "snow-out", kind = "write", label = "change request", note = "Through ServiceNow's Change Management API." },
  { from = "executor", to = "agent", kind = "return", label = "outcome", note = "Execution and outcome rows are written; the graph resumes from its checkpoint." },
]

[[flow]]
id = "flow-readiness"
title = "The pre-release readiness gate"
phase = 4
trigger = "A release's planned window is near."
outcome = "A readiness report for the release and a go or no-go proposal for a person to decide."
lanes = [["agent", "Readiness graph"], ["cicd", "CI/CD"], ["jira-in", "Jira"], ["graph", "Release graph"], ["snow-in", "ServiceNow"], ["iq", "Freeze calendar"], ["proposals", "Proposals"]]
steps = [
  { from = "agent", to = "cicd", kind = "call", label = "commit green?", note = "CI is green on the release commit; the security scan has no criticals; the image is signed and has an SBOM." },
  { from = "agent", to = "jira-in", kind = "call", label = "scope done?", note = "Every issue in the fixVersion is done." },
  { from = "agent", to = "graph", kind = "call", label = "upstream ready?", note = "Each upstream dependency is released or compatible; no dependent component shares the window (conflict detection)." },
  { from = "agent", to = "snow-in", kind = "call", label = "change approved?", note = "The change is approved and the release sits inside its window." },
  { from = "agent", to = "iq", kind = "call", label = "in a freeze?", note = "Not inside a freeze or blackout window; a rollback plan is present." },
  { from = "agent", to = "graph", kind = "call", label = "check results", note = "Each check and its result is recorded (check, check_result)." },
  { from = "agent", to = "proposals", kind = "call", label = "go / no-go", note = "The report becomes a proposal. A person decides, through the approval flow." },
]

[[flow]]
id = "flow-watch"
title = "Watch a release after it ships"
phase = 6
trigger = "The executor records that a release was deployed."
outcome = "Every release ends closed or rolled back, by a proposal a person approved. DORA's four key metrics per team come from the same records."
lanes = [["executor", "Executor"], ["agent", "Watch graph"], ["prom", "Prometheus"], ["kaval", "Kaval"], ["proposals", "Proposals"], ["slack", "Slack card"]]
steps = [
  { from = "executor", to = "agent", kind = "call", label = "deployed", note = "The outcome row starts the watch window." },
  { from = "agent", to = "prom", kind = "call", label = "signals vs baseline", note = "Latency, traffic, errors and saturation against the pre-release baseline, for the whole window." },
  { from = "kaval", to = "agent", kind = "call", label = "incidents", note = "Kaval's incidents in the window, as a second opinion (future scope FS-1)." },
  { from = "agent", to = "agent", kind = "self", label = "healthy?", note = "Healthy or degraded, with the evidence." },
  { from = "agent", to = "proposals", kind = "call", label = "close or roll back", note = "Healthy: release the Jira version and close the change as successful. Degraded: roll back and close the change with issues." },
  { from = "proposals", to = "slack", kind = "call", label = "approval card", note = "Through policy, as every action is. Closing as successful without this check is classed never." },
]

[[flow]]
id = "flow-brake"
title = "The cost brake fires"
phase = 0
trigger = "Spend reaches a budget's brake line, or it is {nightly}."
outcome = "No deployment is left to bill. `make foundry-up` refuses while a budget is past its brake line. Proven live on 2026-11-22 (SPEC-001-R16)."
lanes = [["deployment", "Claude deployment"], ["cost", "Cost Management"], ["budget", "Budgets"], ["ag", "Action group"], ["owner", "Owner's e-mail"], ["runbook", "Brake runbook"], ["schedule", "Nightly schedule"]]
steps = [
  { from = "deployment", to = "cost", kind = "call", label = "token charges", note = "Billed per token. Cost data can arrive up to {lag_days} days late, which is why the brake also runs every night." },
  { from = "cost", to = "budget", kind = "call", label = "spend", note = "Actual spend this month on {resource_group}, and on the Foundry account alone for the model budget." },
  { from = "budget", to = "owner", kind = "call", label = "each alert", note = "Every alert line e-mails the owner directly." },
  { from = "budget", to = "ag", kind = "call", label = "brake line", note = "{total_brake_pct}% of the total ({total_brake}) or {model_brake_pct}% of the model budget ({model_brake}) notifies the action group {action_group}." },
  { from = "ag", to = "owner", kind = "call", label = "notice", note = "The action group's e-mail receiver, verified with a one-time code (ADR-0014, finding 4)." },
  { from = "ag", to = "runbook", kind = "call", label = "webhook", note = "Its runbook receiver starts {runbook} in Azure Automation." },
  { from = "schedule", to = "runbook", kind = "call", label = "every night", note = "{schedule} also starts it at {nightly}, whatever the spend." },
  { from = "runbook", to = "deployment", kind = "write", label = "DELETE", note = "Its managed identity holds a custom role: read the Foundry account, read and delete its deployments, nothing more." },
]

[[flow]]
id = "flow-park"
title = "Park and unpark the deployment"
phase = 0
trigger = "Roshan needs Claude for a session."
outcome = "The deployment exists only while it is used, and the sweep proves it is gone at the end of the session (SPEC-001-R14, R17)."
lanes = [["roshan", "Roshan's laptop"], ["park", "foundry_park.py"], ["checks", "Guardrail checks"], ["foundry", "Foundry account"], ["sweep", "azure_sweep.py"]]
steps = [
  { from = "roshan", to = "park", kind = "call", label = "make foundry-up", note = "Reads the account and deployment names from .env, and the model from guardrails.json." },
  { from = "park", to = "checks", kind = "call", label = "guardrails hold?", note = "Policy {assignment} enforced; both budgets with every alert; the brake line wired to the action group; the nightly schedule linked; no budget past its brake line." },
  { from = "checks", to = "park", kind = "return", label = "all PASS", note = "Any FAIL means REFUSED: the deployment stays parked." },
  { from = "park", to = "foundry", kind = "write", label = "PUT deployment", note = "{model}, {sku}, capacity {capacity}, with Anthropic's attestation fields (modelProviderData) from .env." },
  { from = "foundry", to = "park", kind = "return", label = "Succeeded", note = "Polled from Creating to Succeeded. A deployment that is Deleting or Creating means wait." },
  { from = "roshan", to = "roshan", kind = "self", label = "use Claude", note = "Today the sandbox check's token count; from Phase 2, the router." },
  { from = "roshan", to = "park", kind = "call", label = "make foundry-down", note = "Always allowed, even with a guardrail broken." },
  { from = "park", to = "foundry", kind = "write", label = "DELETE", note = "Every deployment on the account is deleted. Nothing is lost: it bills per token." },
  { from = "roshan", to = "sweep", kind = "call", label = "make azure-sweep", note = "Read-only, at the end of every session." },
  { from = "sweep", to = "roshan", kind = "return", label = "CLEAN", note = "Parked; every resource type on the list; nothing tagged project=thalam outside the group; the guardrails present." },
]

