# gitleaks configuration for Thalam (SPEC-001-R6).
#
# This repository is public from its first push (ADR-0011), so the HISTORY must be clean, not
# just the working tree. Copied from Kaval's and trimmed. Rules are added for CLAUDE.md rule 6
# (no real instance addresses or tenant IDs) for Atlassian, ServiceNow and Azure (ADR-0012), and
# docs and .env.example are no longer exempt: they are where a real address is most likely to be
# pasted.
#
#   gitleaks git --staged    the pre-commit hook (scripts/dev/install-hooks.sh)
#   gitleaks git .           the whole history (CI's `secrets` job, `make secrets-scan`)
#   gitleaks dir .           the working tree

[extend]
useDefault = true

# ─── project-specific rules ──────────────────────────────────

[[rules]]
id = "aws-account-id"
description = "AWS account ID in a committed file"
regex = '''(?i)(aws_?account_?id|account[_-]?id)["'\s:=]+["']?([0-9]{12})["']?'''
tags = ["aws", "identifier"]

[[rules]]
id = "aws-arn-with-account"
description = "ARN containing a real 12-digit account ID"
# re2 has no lookahead, so the 000000000000 placeholder is cleared by the allowlist below.
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:'''
tags = ["aws", "identifier"]

# CLAUDE.md rule 6. A placeholder such as <your-site>.atlassian.net does not match, because the
# character before the dot is `>`, which is not a host character. The site name is caught with or
# without `.net` and with a regex-escaped dot (`name\.atlassian`, as in a grep command). Atlassian's
# own hosts (api., id., developer.atlassian.com) do not match: `.atlassian` followed by `.com` is
# neither `.net` nor the end of the name.
[[rules]]
id = "real-atlassian-site"
description = "A real Atlassian site address; write <your-site>.atlassian.net instead"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\\?\.atlassian(?:\\?\.net\b|[^.a-z0-9-]|$)'''
keywords = ["atlassian"]
tags = ["identifier", "rule-6"]

[[rules]]
id = "real-servicenow-instance"
description = "A real ServiceNow instance address; write <your-pdi>.service-now.com instead"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\.service-now\.com\b'''
keywords = ["service-now.com"]
tags = ["identifier", "rule-6"]

# CLAUDE.md rule 6 also forbids tenant IDs: an Atlassian cloud ID is a UUID in api.atlassian.com URLs.
[[rules]]
id = "atlassian-cloud-id"
description = "An Atlassian cloud ID (tenant) in an API address; keep it in .env as JIRA_SANDBOX_CLOUD_ID"
regex = '''(?i)atlassian\.com/ex/(?:jira|confluence)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["atlassian.com/ex/"]
tags = ["identifier", "rule-6"]

# Azure (ADR-0012). A resource's name is its address: <name>.services.ai.azure.com for Foundry, and
# likewise for Azure OpenAI, AI Services, Foundry IQ (search.windows.net), Key Vault, storage,
# registries, web apps, container apps and managed databases. Placeholders pass for the same
# reason as above (`<your-resource>.`, `{resource}.`), and so do Microsoft's own hosts that have no
# name in front (`https://cognitiveservices.azure.com/.default`, `ai.azure.com`). Every dot may be
# regex-escaped, the form a grep command would leak (ADR-0011).
[[rules]]
id = "real-azure-resource"
description = "A real Azure resource address; write <your-resource>.services.ai.azure.com instead and keep the name in .env"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\\?\.(?:services\\?\.ai\\?\.azure\\?\.com|(?:openai|cognitiveservices)\\?\.azure\\?\.com|vault\\?\.azure\\?\.net|(?:search|blob\\?\.core)\\?\.windows\\?\.net|(?:postgres|mysql)\\?\.database\\?\.azure\\?\.com|azurecr\\?\.io|azurewebsites\\?\.net|azurecontainerapps\\?\.io)\b'''
keywords = ["azure", "windows"]
tags = ["identifier", "rule-6"]

# An Entra tenant or Azure subscription ID is a bare GUID, so it is caught by its context: an az
# flag, a *_id setting, an ARM path or a login URL. The all-zero GUID is cleared by the allowlist.
[[rules]]
id = "azure-tenant-or-subscription-id"
description = "An Entra tenant or Azure subscription ID; keep it out of committed files (the az CLI already knows it)"
regex = '''(?i)(?:--(?:tenant|subscription)[\s=]+["']?|(?:tenant|subscription)[_-]?id["'\s:=]+["']?|/subscriptions/|microsoftonline\.com/)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["tenant", "subscription", "microsoftonline"]
tags = ["identifier", "rule-6"]

[[rules]]
id = "entra-tenant-domain"
description = "A real Entra tenant domain; write <your-tenant>.onmicrosoft.com instead"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\\?\.onmicrosoft\\?\.com\b'''
keywords = ["onmicrosoft"]
tags = ["identifier", "rule-6"]

# ─── allowlist ───────────────────────────────────────────────

[allowlist]
description = "Placeholders and examples"

paths = [
  '''\.gitleaks\.toml$''',
  '''.*\.tfvars\.example$''',
]

regexes = [
  '''000000000000''',                 # placeholder account ID
  '''(?i)you@example\.com''',
  '''(?i)change-?me''',
  '''(?i)<[a-z_-]+>''',               # <your-key-here>
  '''(?i)xxx+''',
  '''(?i)placeholder''',
]
